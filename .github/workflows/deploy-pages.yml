name: Deploy frontend to GitHub Pages

# Temporary, while Vercel and Cloudflare Pages are checked: all three
# hosts build main. Delete this file to retire GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (used by postbuild prerendering)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # GitHub Pages has no rewrites: serve the app for unknown paths so
      # client-side routes load. Only this host needs it (Cloudflare Pages
      # would serve a 404.html instead of the app), so it's made here
      # rather than kept in public/.
      - name: Single-page app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
